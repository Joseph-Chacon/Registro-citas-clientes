services:
  - type: web
    name: agenda-multilocal-api-prueba
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run migrar
    startCommand: npm run iniciar
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db-citas-prueba
          property: connectionString
      - key: CORREO_ADMINISTRADOR_PLATAFORMA
        sync: false

databases:
  - name: db-citas-prueba
    plan: free
    databaseName: db_citas
    user: agenda_multilocal
